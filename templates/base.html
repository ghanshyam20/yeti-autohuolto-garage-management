{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>

        {% block title %}
            Yeti Autohuolto
        {% endblock %}

    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

      <link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

      <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">

    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
          href="{% static 'css/base.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/navbar.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/footer.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/home.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/buttons.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/forms.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/chatbot.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/responsive.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/utilities.css' %}">

</head>

<body>

    {% include 'includes/navbar.html' %}

    {% include 'includes/messages.html' %}

    <main>

        {% block content %}

        {% endblock %}

    </main>

    {% include 'includes/footer.html' %}

    {% include 'includes/chatbot.html' %}

    {% include 'includes/scripts.html' %}

</body>

</html>
