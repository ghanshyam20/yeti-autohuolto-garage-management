<section class="booking-form-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-xl-10">

                <div class="booking-form-wrapper">

                    <form>

                        <div class="row g-4">

                            <!-- Customer -->

                            <div class="col-lg-6">

                                <h5 class="form-section-title">
                                    Customer Information
                                </h5>

                                <div class="mb-3">
                                    <label class="form-label">
                                        Full Name
                                        <span class="text-danger">*</span>
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        placeholder="John Smith">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">
                                        Phone Number
                                        <span class="text-danger">*</span>
                                    </label>

                                    <input
                                        type="tel"
                                        class="form-control"
                                        placeholder="+358...">
                                </div>

                                <div>
                                    <label class="form-label">
                                        Email Address
                                    </label>

                                    <input
                                        type="email"
                                        class="form-control"
                                        placeholder="name@email.com">
                                </div>

                            </div>

                            <!-- Vehicle -->

                            <div class="col-lg-6">

                                <h5 class="form-section-title">
                                    Vehicle Information
                                </h5>

                                <div class="mb-3">
                                    <label class="form-label">
                                        Vehicle Make
                                        <span class="text-danger">*</span>
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        placeholder="Toyota">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">
                                        Vehicle Model
                                        <span class="text-danger">*</span>
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        placeholder="Corolla">
                                </div>

                                <div>
                                    <label class="form-label">
                                        Registration Number
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        placeholder="ABC-123">
                                </div>

                            </div>

                        </div>

                        <hr class="my-5">

                        <div class="row">

                            <div class="col-12">

                                <h5 class="form-section-title">
                                    Service Request
                                </h5>

                            </div>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Service Required
                                <span class="text-danger">*</span>
                            </label>

                            <select class="form-select">

                                <option selected disabled>
                                    Select a service
                                </option>

                                <option>Oil Change</option>

                                <option>Engine Diagnostics</option>

                                <option>Brake Service</option>

                                <option>Tire Service</option>

                                <option>Battery Service</option>

                                <option>Air Conditioning</option>

                                <option>Suspension & Steering</option>

                                <option>General Maintenance</option>

                                <option>Other</option>

                            </select>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Describe the Problem
                            </label>

                            <textarea
                                class="form-control"
                                rows="5"
                                placeholder="Describe the issue or service you need..."></textarea>

                        </div>

                        <div class="row g-4">

                            <div class="col-md-6">

                                <label class="form-label">
                                    Preferred Date
                                    <span class="text-danger">*</span>
                                </label>

                                <input
                                    type="date"
                                    class="form-control">

                            </div>

                            <div class="col-md-6">

                                <label class="form-label">
                                    Preferred Time
                                </label>

                                <select class="form-select">

                                    <option selected>
                                        Morning (08:00 – 12:00)
                                    </option>

                                    <option>
                                        Afternoon (12:00 – 16:00)
                                    </option>

                                    <option>
                                        No Preference
                                    </option>

                                </select>

                            </div>

                        </div>

                        <div class="booking-note mt-5">

                            <i class="bi bi-info-circle"></i>

                            <span>

                                This is a booking request only. We will contact
                                you to confirm the final appointment time.

                            </span>

                        </div>

                        <div class="text-center mt-5">

                            <button
                                type="submit"
                                class="btn btn-primary-custom px-5 py-3">

                                Send Booking Request

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>
