<section class="booking-form-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-xl-10">

                <div class="booking-form-wrapper">

                    <form method="POST">

                        {% csrf_token %}

                        <div class="row g-4">

                            <!-- Customer -->

                            <div class="col-lg-6">

                                <h5 class="form-section-title">
                                    Customer Information
                                </h5>

                                <div class="mb-3">
                                    <label class="form-label">
                                        Full Name
                                        <span class="text-danger">*</span>
                                    </label>

                                    <input
                                        type="text"
                                        name="full_name"
                                        class="form-control"
                                        placeholder="John Smith"
                                        value="{{ form.full_name.value|default:'' }}">
                                    
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">
                                        Phone Number
                                        <span class="text-danger">*</span>
                                    </label>

                                    <input
                                        type="tel"
                                        name="phone_number"
                                        class="form-control"
                                        placeholder="+358..."
                                        value="{{ form.phone_number.value|default:'' }}">
                                </div>

                                <div>
                                    <label class="form-label">
                                        Email Address
                                    </label>

                                    <input
                                        type="email"
                                        name="email"
                                        class="form-control"
                                        placeholder="name@email.com"
                                        value="{{ form.email.value|default:'' }}">
                                </div>

                            </div>

                            <!-- Vehicle -->

                            <div class="col-lg-6">

                                <h5 class="form-section-title">
                                    Vehicle Information
                                </h5>

                                <div class="mb-3">
                                    <label class="form-label">
                                        Vehicle Make
                                        <span class="text-danger">*</span>
                                    </label>

                                    <input
                                        type="text"
                                        name="vehicle_make"
                                        class="form-control"
                                        placeholder="Toyota"
                                        value="{{ form.vehicle_make.value|default:'' }}">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">
                                        Vehicle Model
                                        <span class="text-danger">*</span>
                                    </label>

                                    <input
                                        type="text"
                                        name="vehicle_model"
                                        class="form-control"
                                        placeholder="Corolla"
                                        value="{{ form.vehicle_model.value|default:'' }}">
                                </div>

                                <div>
                                    <label class="form-label">
                                        Registration Number
                                    </label>

                                    <input
                                        type="text"
                                        name="registration_number"
                                        class="form-control"
                                        placeholder="ABC-123"
                                        value="{{ form.registration_number.value|default:'' }}">
                                </div>

                            </div>

                        </div>

                        <hr class="my-5">

                        <div class="row">

                            <div class="col-12">

                                <h5 class="form-section-title">
                                    Service Request
                                </h5>

                            </div>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Service Required
                                <span class="text-danger">*</span>
                            </label>



                            <select
                                name="service_required"
                                class="form-select">

                                <option value="">
                                    Select a service

                                </option>

                                    {% for value, label in form.service_required.field.choices %}

                                        {% if value %}

                                            {% if form.service_required.value == value %}
                                                <option value="{{ value }}" selected>
                                                    {{ label }}
                                                </option>
                                            {% else %}
                                                <option value="{{ value }}">
                                                    {{ label }}
                                                </option>
                                            {% endif %}

                                        {% endif %}

                                    {% endfor %}

                            </select>


                            
                                

                       

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Describe the Problem
                            </label>

                            <textarea
                                name="problem_description"
                                class="form-control"
                                rows="5"
                                placeholder="Describe the issue or service you need...">{{ form.problem_description.value|default:'' }}</textarea>

                        </div>

                        <div class="row g-4">

                            <div class="col-md-6">

                                <label class="form-label">
                                    Preferred Date
                                    <span class="text-danger">*</span>
                                </label>

                                <input
                                    type="date"
                                    name="preferred_date"
                                    class="form-control"
                                    value="{{ form.preferred_date.value|default:'' }}">

                            </div>

                            <div class="col-md-6">

                                <label class="form-label">
                                    Preferred Time
                                </label>

                                <select 
                                    name="preferred_time"
                                    class="form-select">


                                    {% for value, label in form.preferred_time.field.choices %}

                                    <option
                                        value="{{ value }}"
                                        {% if form.preferred_time.value == value %}selected{% endif %}>

                                        {{ label }}

                                    </option>

                                    {% endfor %}

                            

                     
                                    

                                </select>
                            </div>



                   
                        </div>
                        <div class="booking-note mt-5">

                            <i class="bi bi-info-circle"></i>

                            <span>

                                This is a booking request only. We will contact
                                you to confirm the final appointment time.

                            </span>

                        </div>

                        <div class="text-center mt-5">

                            <button
                                type="submit"
                                class="btn btn-primary-custom px-5 py-3">

                                Send Booking Request

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>
